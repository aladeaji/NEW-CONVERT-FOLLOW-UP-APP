# Netlify deploy config for NEW-CONVERT-FOLLOW-UP-APP
# Dashboard: Add new site -> Import an existing project -> GitHub -> select repo.
# Build settings below are picked up automatically. Then add the env vars
# listed in .env.example under "NETLIFY (production)" and Deploy.
[build]
  # Applies DB migrations when DATABASE_URL points at a real database;
  # skips gracefully until one is configured (landing page still goes live).
  command = "prisma migrate deploy || echo 'no reachable database, skipping migrate' && prisma generate && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
